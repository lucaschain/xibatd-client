<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="xibat-browser-revision"
      content="__XIBAT_BROWSER_REVISION__"
    />
    <base id="xibat-browser-base" href="./" />
    <script>
      const XIBAT_BROWSER_REVISION = document.querySelector(
        'meta[name="xibat-browser-revision"]',
      ).content;
      if (/^[0-9a-f]{40}$/.test(XIBAT_BROWSER_REVISION)) {
        document.getElementById("xibat-browser-base").href =
          `/releases/${XIBAT_BROWSER_REVISION}/`;
      }
    </script>
    <title>Loading</title>
    <style>
      body {
        margin: 0;
        background-color: black;
        overscroll-behavior: contain;
      }
      .backbuffer {
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0px;
        border: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        margin-top: 0px;
        padding-left: 10px;
        color: white;
        text-decoration: none;
        z-index: 1;
        text-align: left;
        font-family: "Roboto", Helvetica, sans-serif;
        font-size: 20px;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      #start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        font-size: 2rem;
        display: none;
      }
      #update-required {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.88);
        color: white;
        font-family: "Roboto", Helvetica, sans-serif;
      }
      #update-required.visible {
        display: grid;
      }
      #update-required > div {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      #update-required button {
        margin-top: 1rem;
        padding: 0.7rem 1.5rem;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      class="title"
      id="title-text"
      contenteditable
      virtualkeyboardpolicy="manual"
    ></div>
    <button id="start" onclick="startGame()">Start</button>
    <div id="update-required" role="dialog" aria-modal="true">
      <div>
        <h1>Client update required</h1>
        <p id="update-required-message">
          Reload to use the latest client files. Your settings will be preserved.
        </p>
        <button id="reload-client" onclick="reloadForUpdate()">Reload</button>
      </div>
    </div>
    <canvas
      class="backbuffer"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      let fullscreenRequestPending = false;
      let fullscreenRequestInFlight = false;

      async function lockGameKeyboard() {
        if (!("keyboard" in navigator) || !("lock" in navigator.keyboard)) {
          console.warn(
            "Keyboard Lock is unavailable; use Ctrl+Up to face north.",
          );
          return;
        }

        try {
          await navigator.keyboard.lock(["KeyW"]);
        } catch (error) {
          console.warn(
            "Keyboard Lock was denied; use Ctrl+Up to face north.",
            error,
          );
        }
      }

      async function requestGameFullscreen() {
        if (fullscreenRequestInFlight || document.fullscreenElement) return;

        fullscreenRequestInFlight = true;
        const keyboardLock = lockGameKeyboard();
        try {
          await canvas.requestFullscreen({ navigationUI: "hide" });
          if (!fullscreenRequestPending) {
            if ("keyboard" in navigator && "unlock" in navigator.keyboard) {
              navigator.keyboard.unlock();
            }
            await document.exitFullscreen();
            return;
          }

          fullscreenRequestPending = false;
          await keyboardLock;
        } catch (error) {
          if ("keyboard" in navigator && "unlock" in navigator.keyboard) {
            navigator.keyboard.unlock();
          }
          console.warn(
            "Fullscreen was denied; click the game to try again.",
            error,
          );
        } finally {
          fullscreenRequestInFlight = false;
        }
      }

      function setGameFullscreen(enabled) {
        fullscreenRequestPending = enabled;
        if (enabled) {
          requestGameFullscreen();
          return;
        }

        if ("keyboard" in navigator && "unlock" in navigator.keyboard) {
          navigator.keyboard.unlock();
        }
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function (error) {
            console.warn("Could not exit fullscreen.", error);
          });
        }
      }

      document.addEventListener(
        "pointerdown",
        function () {
          if (fullscreenRequestPending && !document.fullscreenElement) {
            requestGameFullscreen();
          }
        },
        true,
      );
      document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement) {
          fullscreenRequestPending = false;
          if ("keyboard" in navigator && "unlock" in navigator.keyboard) {
            navigator.keyboard.unlock();
          }
        }
      });
      function reportRuntimeError(prefix, error) {
        const payload = [prefix, error]
          .flat()
          .filter(Boolean)
          .map((entry) => {
            if (!entry) return "";
            if (typeof entry === "string") {
              return entry;
            }
            if (entry.stack) {
              return entry.stack;
            }
            try {
              return JSON.stringify(entry);
            } catch (_) {
              return String(entry);
            }
          })
          .join(": ");
        console.error(payload);
        const title = document.getElementById("title-text");
        if (title) {
          title.innerHTML = "Runtime error – check console";
        }
      }
      function startGame() {
        document.getElementById("start").style.display = "none";
        callMain();
        document.addEventListener("touchstart", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("touchmove", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("touchend", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keyup", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keydown", function (ev) {
          if (
            !ev.ctrlKey &&
            ev.key !== "Enter" &&
            ev.key !== "Escape" &&
            ev.key !== "Backspace" &&
            ev.key !== "ArrowLeft" &&
            ev.key !== "ArrowRight" &&
            ev.key !== "ArrowUp" &&
            ev.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", ev));
          } else if (ev.ctrlKey && ev.key === "v") {
            return true;
          }
          ev.preventDefault();
          ev.stopPropagation();
        });
      }
      let persistentStorageSyncInFlight = false;
      let persistentStorageSyncPending = false;
      let persistentStorageSyncWaiters = [];
      let persistentStorageReady = false;
      let persistentStorageLoadFailed = false;

      function requestPersistentStorageSync(callback) {
        if (callback) persistentStorageSyncWaiters.push(callback);
        persistentStorageSyncPending = true;

        if (persistentStorageSyncInFlight) return;
        persistentStorageSyncInFlight = true;
        persistentStorageSyncPending = false;

        const finish = function (error) {
          persistentStorageSyncInFlight = false;
          if (persistentStorageSyncPending && !error) {
            requestPersistentStorageSync();
            return;
          }

          persistentStorageSyncPending = false;
          const waiters = persistentStorageSyncWaiters;
          persistentStorageSyncWaiters = [];
          waiters.forEach(function (waiter) {
            waiter(error);
          });
        };

        const sync = function () {
          try {
            const mount = FS.lookupPath("/user").node.mount;
            if (mount.idbPersistState) {
              setTimeout(sync, 10);
              return;
            }

            FS.syncfs(false, finish);
          } catch (error) {
            finish(error);
          }
        };
        sync();
      }
      let pendingBrowserRevision = null;

      function requireBrowserReload(revision) {
        if (pendingBrowserRevision) return;
        pendingBrowserRevision = revision;
        setGameFullscreen(false);
        document.getElementById("update-required").classList.add("visible");
      }

      async function checkBrowserRevision() {
        if (
          pendingBrowserRevision ||
          !/^[0-9a-f]{40}$/.test(XIBAT_BROWSER_REVISION)
        ) {
          return;
        }

        try {
          const response = await fetch("/revision.json", {
            cache: "no-store",
            credentials: "same-origin",
          });
          if (!response.ok) return;
          const release = await response.json();
          if (
            release &&
            /^[0-9a-f]{40}$/.test(release.revision) &&
            release.revision !== XIBAT_BROWSER_REVISION
          ) {
            requireBrowserReload(release.revision);
          }
        } catch (error) {
          console.warn("Could not check for a browser client update.", error);
        }
      }

      function reloadForUpdate() {
        if (!pendingBrowserRevision) return;
        const button = document.getElementById("reload-client");
        const message = document.getElementById("update-required-message");
        if (!persistentStorageReady) {
          if (!persistentStorageLoadFailed) {
            message.textContent = "Settings are still loading. Retry in a moment.";
            return;
          }

          button.disabled = true;
          message.textContent = "Loading settings...";
          FS.syncfs(true, function (error) {
            button.disabled = false;
            if (error) {
              message.textContent =
                "Settings could not be loaded. Check browser storage and retry.";
              return;
            }
            persistentStorageLoadFailed = false;
            persistentStorageReady = true;
            reloadForUpdate();
          });
          return;
        }
        button.disabled = true;
        message.textContent = "Saving settings...";
        let finished = false;
        const timeout = setTimeout(function () {
          if (finished) return;
          finished = true;
          button.disabled = false;
          message.textContent =
            "Settings could not be saved. Check browser storage and retry.";
        }, 10000);

        requestPersistentStorageSync(function (error) {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          if (error) {
            button.disabled = false;
            message.textContent =
              "Settings could not be saved. Check browser storage and retry.";
            return;
          }
          window.location.replace(
            `/?revision=${encodeURIComponent(pendingBrowserRevision)}`,
          );
        });
      }

      var Module = {
        setGameFullscreen: setGameFullscreen,
        requestPersistentStorageSync: requestPersistentStorageSync,
        locateFile: function (path) {
          return new URL(path, document.baseURI).href;
        },
        preRun: [
          function () {
            addRunDependency("syncfs");
            if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
            FS.mount(IDBFS, { autoPersist: true }, "/user");
            FS.syncfs(true, function (err) {
              if (err) {
                persistentStorageLoadFailed = true;
                Module.print(err);
              } else {
                persistentStorageReady = true;
              }
              removeRunDependency("syncfs");
            });
          },
        ],
        postRun: [],
        print: (function () {
          return function (text) {
            text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
          };
        })(),
        printErr: function () {
          reportRuntimeError("stderr", Array.prototype.slice.call(arguments).join(" "));
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          return canvas;
        })(),
        onAbort: function (reason) {
          reportRuntimeError("abort", reason || "unknown reason");
        },
        setStatus: function (text) {
          console.log("status: " + text);
          let display = "";
          if (text.includes("Running...")) {
            display = "Loading...";
            document.getElementById("start").style.display = "block";
          } else if (text.includes("Downloading data...")) {
            display = text;
          }

          document.getElementById("title-text").innerHTML = display;
        },
        monitorRunDependencies: function (left) {
          console.log("monitor run deps: " + left);
          document.getElementById("title-text").innerHTML = "Initializing...";
        },
      };
      window.setInterval(checkBrowserRevision, 60000);
      window.addEventListener("focus", checkBrowserRevision);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") checkBrowserRevision();
      });
      checkBrowserRevision();
      function warnBeforeUnload(event) {
        event.preventDefault();
        event.returnValue = "";
      }
      Module.setWarnBeforeUnload = function (enabled) {
        const action = enabled ? "addEventListener" : "removeEventListener";
        window[action]("beforeunload", warnBeforeUnload);
      };
      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
