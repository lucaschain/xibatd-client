name: Publish browser client

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - "browser/**"
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "src/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "overlay-ports/**"
      - "CMakeLists.txt"
      - "init.lua"
      - "otclientrc.lua"
      - ".github/workflows/reusable-build-browser.yml"
      - ".github/workflows/reusable-tests-lua.yml"
      - ".github/workflows/publish-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-client
  cancel-in-progress: false

env:
  CLIENT_BUCKET: principal-346712-xibat-client-downloads

jobs:
  tests:
    name: Lua tests
    uses: ./.github/workflows/reusable-tests-lua.yml

  build:
    needs: tests
    uses: ./.github/workflows/reusable-build-browser.yml

  publish:
    name: Publish browser bundle
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download browser bundle
        uses: actions/download-artifact@v8
        with:
          name: otclient-browser-${{ github.sha }}
          path: ${{ runner.temp }}/browser-artifact

      - name: Package browser bundle
        id: bundle
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/browser-artifact/build-emscripten-web"
          for file in otclient.html otclient.js otclient.wasm otclient.data; do
            test -s "$bundle/$file"
          done
          archive="xibatd-browser-$GITHUB_SHA.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$bundle" -czf "$RUNNER_TEMP/$archive" .
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/880168374503/locations/global/workloadIdentityPools/xibat-github/providers/github
          service_account: xibat-client-publisher@principal-346712.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish browser deployment
        env:
          ARCHIVE: ${{ steps.bundle.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          immutable="gs://$CLIENT_BUCKET/client/browser/$GITHUB_SHA"
          latest="gs://$CLIENT_BUCKET/client/browser/latest"
          public_url="https://storage.googleapis.com/$CLIENT_BUCKET/client/browser/$GITHUB_SHA/$ARCHIVE"

          gcloud storage cp --no-clobber --cache-control="public,max-age=31536000,immutable" \
            "$RUNNER_TEMP/$ARCHIVE" "$immutable/$ARCHIVE"
          gcloud storage cp --no-clobber --cache-control="public,max-age=31536000,immutable" \
            "$RUNNER_TEMP/$ARCHIVE.sha256" "$immutable/$ARCHIVE.sha256"
          jq --null-input \
            --arg revision "$GITHUB_SHA" \
            --arg archive "$ARCHIVE" \
            --arg url "$public_url" \
            --arg sha256 "$ARCHIVE_SHA256" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{revision: $revision, archive: $archive, url: $url, sha256: $sha256, published_at: $published_at}' \
            > "$RUNNER_TEMP/latest.json"
          gcloud storage cp --cache-control="no-cache,max-age=0" \
            "$RUNNER_TEMP/latest.json" "$latest/latest.json"

      - name: Report deployment
        run: |
          {
            echo '### Browser client published'
            echo "- Revision: \`$GITHUB_SHA\`"
            echo '- URL: https://play.xibatd.online/'
            echo '- The production VM will apply the manifest within approximately one minute.'
          } >> "$GITHUB_STEP_SUMMARY"
