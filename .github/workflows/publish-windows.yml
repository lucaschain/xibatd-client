name: Publish Windows client

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "updater/**"
      - "src/**"
      - "cmake/**"
      - "vc18/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "overlay-ports/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "init.lua"
      - "otclientrc.lua"
      - "config.ini"
      - "build-windows.ps1"
      - "cacert.pem"
      - "LICENSE"
      - ".github/workflows/reusable-build-windows.yml"
      - ".github/workflows/reusable-tests-lua.yml"
      - ".github/workflows/publish-windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic client version, for example 0.1.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-windows-client
  cancel-in-progress: false

env:
  CLIENT_BUCKET: principal-346712-xibat-client-downloads

jobs:
  tests:
    name: Lua tests
    uses: ./.github/workflows/reusable-tests-lua.yml

  build:
    needs: tests
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      release_only: true
    secrets: inherit

  publish:
    name: Package and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download release executable
        uses: actions/download-artifact@v8
        with:
          name: windows-cmake-release
          path: build/windows-release/bin

      - name: Resolve release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="0.1.$GITHUB_RUN_NUMBER"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          (( ${#version} <= 64 ))
          [[ "$version" != *".."* ]]
          short_sha="${GITHUB_SHA:0:12}"
          archive="xibatd-client-windows-x64-$version-$short_sha.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Assemble portable client
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/xibatd-client"
          install -d "$stage"
          cp -a data mods modules updater "$stage/"
          rm -rf "$stage/data/things" "$stage/data/sounds"
          rm -f "$stage/updater/test-install-update.ps1"
          cp build/windows-release/bin/otclient.exe init.lua otclientrc.lua config.ini cacert.pem LICENSE "$stage/"
          test -s "$stage/otclient.exe"
          test -s "$stage/init.lua"
          test ! -e "$stage/data/things/1098/Tibia.dat"
          test ! -e "$stage/data/things/1098/Tibia.spr"
          jq --null-input \
            --argjson schema 1 \
            --argjson sequence "$GITHUB_RUN_NUMBER" \
            --arg version "$VERSION" \
            --arg revision "$GITHUB_SHA" \
            '{schema: $schema, sequence: $sequence, version: $version, revision: $revision}' \
            > "$stage/update-release.json"
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort \
            | jq -Rn '[inputs] + ["managed-files.json"] | {schema: 1, files: .}' \
            > "$stage/managed-files.json"
          (cd "$RUNNER_TEMP" && zip -9 -r "$ARCHIVE" xibatd-client)
          (cd "$RUNNER_TEMP" && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/880168374503/locations/global/workloadIdentityPools/xibat-windows-github/providers/github-windows-client
          service_account: xibat-windows-publisher@principal-346712.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Sign update manifest
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/client-update-signing-key.pem"
          gcloud secrets versions access latest --secret=xibat-client-update-signing-key > "$key"
          chmod 600 "$key"
          public_key="$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)"
          test "$public_key" = 'MCowBQYDK2VwAyEAHmXfV/TVMnijkVUC09VHaB+VqueWPpPbJqQ8zsL9N6w='

          archive_sha256="$(cut -d' ' -f1 "$RUNNER_TEMP/$ARCHIVE.sha256")"
          archive_size="$(stat -c '%s' "$RUNNER_TEMP/$ARCHIVE")"
          archive_url="https://storage.googleapis.com/$CLIENT_BUCKET/client/windows/$VERSION/$GITHUB_SHA/$ARCHIVE"
          jq -cS --null-input \
            --argjson schema 1 \
            --arg channel stable \
            --arg platform windows-x64 \
            --argjson sequence "$GITHUB_RUN_NUMBER" \
            --arg version "$VERSION" \
            --arg revision "$GITHUB_SHA" \
            --arg archive_url "$archive_url" \
            --arg archive_sha256 "$archive_sha256" \
            --argjson archive_size "$archive_size" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema: $schema, channel: $channel, platform: $platform, sequence: $sequence, version: $version, revision: $revision, archive_url: $archive_url, archive_sha256: $archive_sha256, archive_size: $archive_size, published_at: $published_at}' \
            > "$RUNNER_TEMP/update-payload.json"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in "$RUNNER_TEMP/update-payload.json" -out "$RUNNER_TEMP/update-signature.bin"
          jq --null-input \
            --argjson schema 1 \
            --arg key_id xibat-client-2026-01 \
            --arg payload "$(base64 -w0 "$RUNNER_TEMP/update-payload.json")" \
            --arg signature "$(base64 -w0 "$RUNNER_TEMP/update-signature.bin")" \
            '{schema: $schema, key_id: $key_id, payload: $payload, signature: $signature}' \
            > "$RUNNER_TEMP/update.json"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey <(openssl pkey -in "$key" -pubout) \
            -in "$RUNNER_TEMP/update-payload.json" -sigfile "$RUNNER_TEMP/update-signature.bin"
          rm -f "$key" "$RUNNER_TEMP/update-signature.bin"

      - name: Publish release
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          SEQUENCE: ${{ github.run_number }}
          VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -Eeuo pipefail
          immutable="gs://$CLIENT_BUCKET/client/windows/$VERSION/$GITHUB_SHA"
          latest="gs://$CLIENT_BUCKET/client/windows/latest"

          gcloud storage cp --no-clobber --cache-control="public,max-age=31536000,immutable" \
            "$RUNNER_TEMP/$ARCHIVE" "$immutable/$ARCHIVE"
          gcloud storage cp --no-clobber --cache-control="public,max-age=31536000,immutable" \
            "$RUNNER_TEMP/$ARCHIVE.sha256" "$immutable/$ARCHIVE.sha256"
          gcloud storage cp --no-clobber --cache-control="public,max-age=31536000,immutable" \
            "$RUNNER_TEMP/update.json" "$immutable/update.json"

          cp "$RUNNER_TEMP/$ARCHIVE" "$RUNNER_TEMP/xibatd-client-windows-x64.zip"
          (cd "$RUNNER_TEMP" && sha256sum xibatd-client-windows-x64.zip \
            > xibatd-client-windows-x64.zip.sha256)
          jq --null-input \
            --arg version "$VERSION" \
            --arg revision "$GITHUB_SHA" \
            --arg archive "$ARCHIVE" \
            --arg url "https://storage.googleapis.com/$CLIENT_BUCKET/client/windows/$VERSION/$GITHUB_SHA/$ARCHIVE" \
            --arg sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/$ARCHIVE.sha256")" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, revision: $revision, archive: $archive, url: $url, sha256: $sha256, published_at: $published_at}' \
            > "$RUNNER_TEMP/latest.json"

          promote=true
          if gcloud storage cp "$latest/update.json" "$RUNNER_TEMP/current-update.json" 2>/dev/null; then
            current_sequence="$(jq -er '.payload' "$RUNNER_TEMP/current-update.json" | base64 -d | jq -er '.sequence')"
            if (( current_sequence >= SEQUENCE )); then
              promote=false
              echo "Not promoting sequence $SEQUENCE over current sequence $current_sequence."
            fi
          fi
          if [[ "$promote" == true ]]; then
            gcloud storage cp --cache-control="no-cache,max-age=0" \
              "$RUNNER_TEMP/xibatd-client-windows-x64.zip" "$latest/xibatd-client-windows-x64.zip"
            gcloud storage cp --cache-control="no-cache,max-age=0" \
              "$RUNNER_TEMP/xibatd-client-windows-x64.zip.sha256" "$latest/xibatd-client-windows-x64.zip.sha256"
            gcloud storage cp --cache-control="no-cache,max-age=0" \
              "$RUNNER_TEMP/latest.json" "$latest/latest.json"
            gcloud storage cp --cache-control="no-cache,max-age=0" \
              "$RUNNER_TEMP/update.json" "$latest/update.json"
          fi

      - name: Upload packaged client
        uses: actions/upload-artifact@v7
        with:
          name: xibatd-client-windows-x64-${{ steps.release.outputs.version }}-${{ steps.release.outputs.short_sha }}
          path: |
            ${{ runner.temp }}/${{ steps.release.outputs.archive }}
            ${{ runner.temp }}/${{ steps.release.outputs.archive }}.sha256
            ${{ runner.temp }}/update.json
          if-no-files-found: error

      - name: Report release
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo '### Windows client published'
            echo "- Version: \`$VERSION\`"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Archive: \`$ARCHIVE\`"
            echo "- Download: https://storage.googleapis.com/$CLIENT_BUCKET/client/windows/latest/xibatd-client-windows-x64.zip"
          } >> "$GITHUB_STEP_SUMMARY"
